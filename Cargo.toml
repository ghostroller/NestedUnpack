[package]
name = "nestedunpack"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[[bin]]
name = "NestedUnpack"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
egui_extras = { version = "=0.36.2", default-features = false }
egui-phosphor = "=0.14.0"
fontdb = "0.24"
rfd = "0.17"
rpassword = "7"
serde_json = "1"
sevenz-turbo = { version = "=0.30.3", default-features = false, features = ["aes256", "native-crypto", "bzip2-permissive", "ppmd", "deflate", "brotli", "lz4", "zstd"] }
tempfile = "3"
unrar_sys = "=0.5.8"
zeroize = "1.8"
zip = { version = "=9.8.1", default-features = false, features = ["aes-crypto", "deflate", "bzip2-rs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
