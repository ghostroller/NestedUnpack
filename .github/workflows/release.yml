name: Release builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0-x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the release Rust toolchain
        shell: pwsh
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal

      - name: Test and build
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$visualStudio) { throw 'Visual Studio C++ Build Tools were not found.' }
          & (Join-Path $visualStudio 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = ./build.ps1 -OutputDirectory 'dist/portable'
          $smoke = Start-Process -FilePath $executable -ArgumentList '--version' -NoNewWindow -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { exit $smoke.ExitCode }

      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/portable/NestedUnpack.exe
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Upload project license
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: LICENSE
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Upload third-party notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: THIRD-PARTY-NOTICES.txt
          archive: false
          if-no-files-found: error
          overwrite: true

  build-unix:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: NestedUnpack-linux-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: NestedUnpack-macos-arm64
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      RUST_TARGET: ${{ matrix.target }}
      RELEASE_ASSET: ${{ matrix.asset }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Install the release Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Build and inspect the executable
        run: |
          cargo build --release --locked --target "$RUST_TARGET"
          mkdir -p dist/portable
          binary="dist/portable/$RELEASE_ASSET"
          cp "target/$RUST_TARGET/release/NestedUnpack" "$binary"
          file "$binary"
          wc -c "$binary"
          "$binary" --version

      - name: Run tests
        run: cargo test --release --locked --target "$RUST_TARGET"

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/portable/${{ matrix.asset }}
          archive: false
          if-no-files-found: error
          overwrite: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-unix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{NestedUnpack.exe,NestedUnpack-linux-x64,NestedUnpack-macos-arm64,LICENSE,THIRD-PARTY-NOTICES.txt}'
          merge-multiple: true
          skip-decompress: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            NestedUnpack.exe NestedUnpack-linux-x64 NestedUnpack-macos-arm64 LICENSE THIRD-PARTY-NOTICES.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
